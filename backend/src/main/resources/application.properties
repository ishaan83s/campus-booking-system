spring.application.name=backend

# MySQL 8 datasource. Supply DB_URL, DB_USERNAME, and DB_PASSWORD in the
# environment rather than committing credentials to the repository.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/office_hours_booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The schema is owned by the database DDL in the Backend Development Bible;
# Hibernate must validate it rather than modifying it at application startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT configuration; override APP_JWT_SECRET outside local development.
app.jwt.secret=${APP_JWT_SECRET:change-this-development-secret-key-to-at-least-32-bytes}
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:86400}
